version: '3.8'

services:
  postgres-benchmark:
    image: postgres:15
    container_name: task-queue-benchmark-db
    environment:
        POSTGRES_USER: benchmark_user
        POSTGRES_PASSWORD: benchmark_password
        POSTGRES_DB: task_queue_db
    ports:
      - "5432:5432"
    volumes:
      - ./benchmark-schema.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always